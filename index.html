<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YippieWheels</title>
    
    <!-- Loading Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Loading VT323, a retro pixel font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #1a1a1a;
            color: #801a1a;
        }
        
        /* Custom scrollbar to keep the retro vibe */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-left: 1px solid #801a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #801a1a;
        }
    </style>
</head>
<body class="min-h-screen p-8 max-w-5xl mx-auto text-2xl sm:text-3xl">

    <!-- HEADER SECTION -->
    <header class="mb-6">
        <div class="flex items-end gap-4 mb-6">
            
            <!-- 
            *** AVATAR PLACEHOLDER ***
            Replace the div below with your pixelated burning skeleton gif. 
            Example: <img src="burning_skeleton.gif" alt="avatar" class="w-24 h-24 sm:w-32 sm:h-32 object-cover">
            -->
            <div class="w-24 h-24 sm:w-32 sm:h-32 bg-[#801a1a] flex-shrink-0"></div>
            
            <h1 class="text-5xl sm:text-7xl leading-none">YippieWheels</h1>
        </div>
        
        <div class="pl-2">
            &lt;Description&gt;
        </div>
    </header>

    <!-- SEPARATOR LINE -->
    <hr class="border-[#801a1a] mb-8">

    <!-- MAIN CONTENT GRID -->
    <main class="flex flex-col md:flex-row gap-8 sm:gap-12">
        
        <!-- LEFT SIDE: TOOLS GRID -->
        <section class="flex-grow">
            <h2 class="text-4xl mb-6 pl-2">Tools:</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-10">
                
                <!-- TOOL 1 -->
                <div class="flex flex-col items-start">
                    <!-- 
                    *** HOW TO ADD YOUR TOOL IMAGE ***
                    Replace the src attribute below with your image link or file name.
                    Example: <img src="my-game-pic.png" alt="Tool 1" class="w-full h-full object-cover">
                    -->
                    <div class="w-full h-[150px] border border-[#801a1a] mb-3 overflow-hidden">
                        <img src="https://placehold.co/400x150/1a1a1a/801a1a?text=Image" alt="Tool placeholder" class="w-full h-full object-cover">
                    </div>
                    <!-- 
                    *** HOW TO LINK YOUR HTML FILES ***
                    Change the href="#" attribute to the name of your file.
                    -->
                    <a href="#" class="border-b border-[#801a1a] hover:bg-[#801a1a] hover:text-[#1a1a1a] transition-colors pb-1">
                        &lt;Tool Name&gt;
                    </a>
                </div>

                <!-- TOOL 2 -->
                <div class="flex flex-col items-start">
                    <div class="w-full h-[150px] border border-[#801a1a] mb-3 overflow-hidden">
                        <img src="https://placehold.co/400x150/1a1a1a/801a1a?text=Image" alt="Tool placeholder" class="w-full h-full object-cover">
                    </div>
                    <a href="#" class="border-b border-[#801a1a] hover:bg-[#801a1a] hover:text-[#1a1a1a] transition-colors pb-1">
                        &lt;Tool Name&gt;
                    </a>
                </div>

                <!-- TOOL 3 -->
                <div class="flex flex-col items-start">
                    <div class="w-full h-[150px] border border-[#801a1a] mb-3 overflow-hidden">
                        <img src="https://placehold.co/400x150/1a1a1a/801a1a?text=Image" alt="Tool placeholder" class="w-full h-full object-cover">
                    </div>
                    <a href="#" class="border-b border-[#801a1a] hover:bg-[#801a1a] hover:text-[#1a1a1a] transition-colors pb-1">
                        &lt;Tool Name&gt;
                    </a>
                </div>

                <!-- TOOL 4 -->
                <div class="flex flex-col items-start">
                    <div class="w-full h-[150px] border border-[#801a1a] mb-3 overflow-hidden">
                        <img src="https://placehold.co/400x150/1a1a1a/801a1a?text=Image" alt="Tool placeholder" class="w-full h-full object-cover">
                    </div>
                    <a href="#" class="border-b border-[#801a1a] hover:bg-[#801a1a] hover:text-[#1a1a1a] transition-colors pb-1">
                        &lt;Tool Name&gt;
                    </a>
                </div>

            </div>
        </section>

        <!-- RIGHT SIDE: ABOUT ME -->
        <aside class="w-full md:w-1/3 min-h-[400px] border border-[#801a1a] p-6 flex flex-col">
            <h2 class="text-4xl mb-8 text-center">About Me</h2>
            <div class="text-xl sm:text-2xl leading-relaxed flex-grow">
                <p class="mb-4">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam in dui mauris. Vivamus hendrerit arcu sed erat molestie vehicula.
                </p>
                <p>
                    &lt;Text&gt;
                </p>
            </div>
        </aside>

    </main>

</body>
</html>
