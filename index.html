<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YippieWheels</title>
    
    <!-- Tailwind CSS para el layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración de colores personalizados para Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        retroRed: '#e50000', 
                        retroBg: '#0a0a0a',  
                    }
                }
            }
        }
    </script>
    
    <!-- Fuente Pixelada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #0a0a0a;
            color: #e50000;
        }
        
        /* Scrollbar retro */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; border-left: 1px solid #e50000; }
        ::-webkit-scrollbar-thumb { background: #e50000; }

        /* Estilo para los cuadros del contador retro */
        .digit-box {
            display: inline-block;
            border: 1px solid #e50000;
            padding: 2px 6px;
            margin: 0 2px;
            font-size: 1.5rem;
            line-height: 1;
        }

        /* Enlaces ocultos que cubren toda la caja de la herramienta */
        .tool-card { position: relative; }
        .tool-card a::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 10;
        }

        /* Clase mágica para que las imágenes pequeñas no se vean borrosas al agrandarlas */
        .pixel-art {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-7xl mx-auto text-xl sm:text-2xl selection:bg-retroRed selection:text-retroBg">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="border-2 border-retroRed p-6 relative flex flex-col min-h-[90vh]">

        <!-- HEADER -->
        <header class="relative mb-4 flex flex-col md:flex-row md:items-start justify-between gap-4">
            
            <div class="flex-1">
                <div class="flex items-center gap-6 mb-4">
                    <!-- AVATAR -->
                    <div class="w-20 h-20 sm:w-28 sm:h-28 flex-shrink-0 bg-yellow-100 flex items-center justify-center border border-retroRed">
                        <!-- Reemplaza el src con tu calavera quemandose -->
                        <img src="https://cdn.pixabay.com/animation/2022/07/31/02/24/02-24-40-130_512.gif" alt="Skull Avatar" class="w-full h-full object-cover">
                    </div>
                    
                    <!-- TITULO -->
                    <h1 class="text-6xl sm:text-8xl tracking-widest uppercase">YippieWheels</h1>
                </div>

                <p class="text-retroRed opacity-90 max-w-3xl leading-tight">
                    &lt;There is a list of tools I created for Happy Wheels! To be transparent, they were made using AI—but I still think you can do some great things with them!&gt;
                </p>
            </div>

            <!-- DOODLES SUPERIOR DERECHA -->
            <div class="w-full md:w-64 h-32 border border-dashed border-retroRed relative md:absolute top-0 right-0 flex items-center justify-center p-2 opacity-90">
                <img src="https://thumbsnap.com/i/qt8bd3Rq.png" alt="Under Construction Doodle" class="h-full w-auto object-contain pixel-art">
            </div>

        </header>

        <!-- FECHA Y HORA FUNCIONAL -->
        <div class="text-right mb-2 text-xl sm:text-2xl flex justify-end items-center gap-4">
            <span id="datetime">...</span>
            <span
